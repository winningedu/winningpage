<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>위닝에듀</title>
    <meta name="description" content="위닝에듀는 학습진단, 목표관리, 수행평가, 성장설계, 자기평가, 심화탐구와 1:1 콜멘토링, 프리미엄 입시 컨설팅을 제공합니다. 데이터와 실적으로 증명하는 대한민국 대표 입시 컨설팅 플랫폼입니다." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="위닝에듀" />
    <meta property="og:title" content="위닝에듀" />
    <meta property="og:description" content="위닝에듀는 학습진단, 목표관리, 수행평가, 성장설계, 자기평가, 심화탐구와 1:1 콜멘토링, 프리미엄 입시 컨설팅을 제공합니다. 데이터와 실적으로 증명하는 대한민국 대표 입시 컨설팅 플랫폼입니다." />
    <meta property="og:url" content="https://www.winningedu.com/" />
    <meta property="og:image" content="https://www.winningedu.com/images/og/og-winning.png" />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preload" as="image" href="/images/winning-logo-horizontal.svg" fetchpriority="high" />
    <!-- Pretendard Variable dynamic-subset 92조각 중 유일하게 전 페이지 확정 사용되는 조각
         (Basic Latin 전체 + 한국어 최빈 음절 13자). SPA라 @font-face 매칭이 React 렌더 이후로
         밀리므로 이 preload로 폰트 요청 시작점을 문서 파싱 시점까지 앞당긴다.
         crossorigin 필수 — 없으면 동일 출처에서도 CORS 모드 불일치로 이중 다운로드된다. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/pretendard-1.3.9/PretendardVariable.subset.91.woff2"
    />

    <style>
      html,
      body,
      #root {
        margin: 0;
        /* src/index.css body 규칙과 동일한 이유 — 320px 뷰포트에서 세로 스크롤바만큼
           줄어든 실제 가용폭(100%)이 고정 320px보다 좁아져 가로 스크롤이 생긴다.
           html 요소는 이 인라인 스타일에서만 min-width가 걸려 있어 src/index.css의
           body 수정만으로는 해결되지 않았다. */
        min-width: min(320px, 100%);
        min-height: 100%;
        background: #ffffff;
      }

      body {
        /* src/index.css body 규칙과 값을 바이트 단위로 동일하게 유지한다.
           'Pretendard'(정적명)가 아니라 'Pretendard Variable'인 이유는
           src/index.css의 동일 주석 참고 — 이름이 다르면 웹폰트가 매칭되지 않는다. */
        font-family:
          'Pretendard Variable',
          'Noto Sans KR',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        /* hidden이 아니라 clip인 이유: hidden은 body를 별도 스크롤 컨테이너로 만들어
           body 안 position: sticky가 문서(html) 스크롤이 아닌 body 자신을 기준으로
           붙어 버린다(목표관리 페이지 헤더 접힘, 2026-09-07). clip은 가로 넘침을
           똑같이 잘라내면서 스크롤 컨테이너를 만들지 않는다. src/index.css 모바일
           body 규칙과 같은 값. */
        overflow-x: clip;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      #pre-header {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 40;
        width: 100%;
        height: 4rem;
        border-bottom: 1px solid rgba(13, 27, 42, 0.1);
        background: #ffffff;
        box-shadow: 0 8px 28px rgba(13, 27, 42, 0.08);
      }

      .pre-header-inner {
        /* 실헤더(Header.jsx)의 좌표계 1(로고+계정 그룹)과 동일하게 max-w-[120rem](1920px)
           밴드를 기준으로 로고를 좌측 끝에 배치한다. nav는 실헤더에서 별도의 1200px
           컨텐츠 좌표계로 분리됐으므로 프리헤더는 로고 위치만 재현하면 된다. */
        width: 100%;
        max-width: 120rem;
        height: 4rem;
        margin: 0 auto;
        padding: 0 32px;
        display: flex;
        align-items: center;
      }

      .pre-logo-link {
        display: flex;
        width: 11.875rem;
        height: 4rem;
        align-items: center;
        flex-shrink: 0;
      }

      .pre-logo {
        display: block;
        width: 11.875rem;
        height: 1.5rem;
        object-fit: contain;
      }

      /* Header.jsx의 로고는 모든 뷰포트에서 동일한 h-6(24px, 가로형 리뉴얼 로고) 고정
         크기이므로 프리헤더 로고 치수도 브레이크포인트 구분 없이 동일하게 유지해
         하이드레이션 시 로고 크기 점프가 생기지 않게 한다. */
      @media (max-width: 900px) {
        #pre-header {
          height: 76px;
        }

        .pre-header-inner {
          height: 76px;
          padding: 0 20px;
        }

        .pre-logo-link {
          width: 11.875rem;
          height: 76px;
        }
      }
    </style>
  </head>

  <body data-overlayscrollbars-initialize>
    <div id="pre-header" aria-hidden="true">
      <div class="pre-header-inner">
        <div class="pre-logo-link">
          <img
            class="pre-logo"
            src="/images/winning-logo-horizontal.svg"
            alt=""
            width="190"
            height="24"
          />
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
