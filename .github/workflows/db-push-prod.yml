# main 브랜치에 마이그레이션이 머지되면 prod DB(ykrpjcsubmbenfcnwlzd)에 자동 적용.
# 배포 순서: 앱(Vercel)과 병렬로 돌므로 파괴적 변경은 expand-contract 2단계로 나눌 것.
name: db-push-prod

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: db-push-prod
  cancel-in-progress: false

jobs:
  push-prod:
    runs-on: ubuntu-latest
    environment: prod-db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      PROJECT_REF: ykrpjcsubmbenfcnwlzd
    steps:
      - uses: actions/checkout@v4

      # CLI 버전은 package-lock.json 의 supabase 에서 읽는다(로컬 npx supabase 와 같은 버전).
      - uses: supabase/setup-cli@v3
      - run: supabase --version

      - run: supabase link --project-ref "$PROJECT_REF"

      # --include-all: 원격 마지막 적용 버전보다 작은 타임스탬프의 미적용 파일도 적용한다.
      # 병렬 브랜치가 각자 번호를 매기면 머지 순서와 파일명 순서가 어긋날 수 있고, 기본
      # 동작은 그 경우 push 자체를 거부해 이후 모든 마이그레이션이 연쇄 차단된다
      # (2026-08-24 #159가 0825 접두사로 먼저 적용된 뒤 #165의 0824000007/8이 막힌 사고).
      - run: supabase db push --include-all
