# 마이그레이션 리허설 CI — PR에 supabase/ 변경이 있으면 로컬 Docker 스택에
# 전체 재생(baseline부터 seed까지)을 돌려본다.
#
# required check("rehearse-migrations")로 쓰기 위해 모든 PR에서 트리거된다.
# paths 필터를 쓰면 미변경 PR에서 check가 아예 안 떠서 머지가 영구 블록되기 때문.
# supabase/ 변경이 없으면 즉시 성공으로 끝난다.
name: db-migrations-ci

on:
  pull_request:

jobs:
  rehearse-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect supabase/ changes
        id: changes
        run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD | grep -q '^supabase/'; then
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=false" >> "$GITHUB_OUTPUT"
            echo "supabase/ 변경 없음 — 리허설 생략"
          fi

      # 새 마이그레이션 파일명의 타임스탬프 검사 — `supabase migration new`가 찍는 실제
      # 생성 시각(UTC)만 허용한다. (1) 미래 시각 금지, (2) 베이스 브랜치에 이미 있는
      # 모든 파일보다 큰 번호여야 한다. 손으로 미래 날짜를 매기면 다른 브랜치의 정상
      # 번호가 뒤로 밀려 push가 막힌다(2026-08-24 사고, db-push-*.yml 주석 참고).
      - name: Check new migration timestamps
        if: steps.changes.outputs.supabase == 'true'
        run: |
          now=$(date -u +%Y%m%d%H%M%S)
          base_max=$(git ls-tree --name-only "origin/$GITHUB_BASE_REF" supabase/migrations/ \
            | sed -E 's#.*/([0-9]{14})_.*#\1#' | grep -E '^[0-9]{14}$' | sort | tail -1)
          fail=0
          for f in $(git diff --name-only --diff-filter=A "origin/$GITHUB_BASE_REF"...HEAD -- supabase/migrations/); do
            name=$(basename "$f")
            ts=$(echo "$name" | sed -E 's/^([0-9]{14})_.*/\1/')
            if ! echo "$ts" | grep -qE '^[0-9]{14}$'; then
              echo "::error file=$f::파일명이 <YYYYMMDDHHMMSS>_<설명>.sql 형식이 아님 — supabase migration new 로 생성할 것"; fail=1; continue
            fi
            if [ "$ts" -gt "$now" ]; then
              echo "::error file=$f::타임스탬프 $ts 가 현재 UTC $now 보다 미래 — 실제 생성 시각만 허용"; fail=1
            fi
            if [ -n "$base_max" ] && [ "$ts" -le "$base_max" ]; then
              echo "::error file=$f::타임스탬프 $ts 가 $GITHUB_BASE_REF 의 마지막 마이그레이션 $base_max 이하 — 베이스 최신화 후 supabase migration new 로 다시 생성할 것"; fail=1
            fi
          done
          exit $fail

      # 마이그레이션이 참조 데이터(scripts/lib/migrationDataInserts.mjs의
      # ALLOWED_TABLES) 밖 테이블에 insert하지 않는지 검사한다. W 영업
      # 데이터가 마이그레이션에 섞여 S에 재현되는 사고(2026-09 발견)를
      # 막는다. npm ci 이전 단계라 node 내장 모듈만 쓰는 순수 스크립트다.
      - name: Check migration data inserts
        if: steps.changes.outputs.supabase == 'true'
        run: node scripts/check-migration-data-inserts.mjs

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.supabase == 'true'
        with:
          version: latest

      - name: Start local database and replay all migrations
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db start

      - name: Reset — migrations + seed full replay
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db reset

      - name: Lint database schema
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db lint --fail-on error

      # src/types/database.types.ts는 supabase gen types의 생성물(npm run gen:types)이다.
      # 마이그레이션 PR이 이 재생성을 빼먹으면 타입과 DB가 어긋난 채로 머지된다 —
      # 방금 재생한 로컬 DB에서 타입을 다시 뽑아 커밋본과 비교해 잡는다.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changes.outputs.supabase == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.supabase == 'true'
        run: npm ci

      - name: Generate types from rehearsed schema
        if: steps.changes.outputs.supabase == 'true'
        run: supabase gen types typescript --local --schema public > /tmp/database.types.generated.ts

      - name: Check committed database.types.ts matches schema
        if: steps.changes.outputs.supabase == 'true'
        run: node scripts/check-database-types-drift.mjs src/types/database.types.ts /tmp/database.types.generated.ts
