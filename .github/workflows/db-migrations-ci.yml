# 마이그레이션 리허설 CI — PR에 supabase/ 변경이 있으면 로컬 Docker 스택에
# 전체 재생(baseline부터 seed까지)을 돌려본다.
#
# required check("rehearse-migrations")로 쓰기 위해 모든 PR에서 트리거된다.
# paths 필터를 쓰면 미변경 PR에서 check가 아예 안 떠서 머지가 영구 블록되기 때문.
# supabase/ 변경이 없으면 즉시 성공으로 끝난다.
#
# 같은 코드 트리가 릴리스 한 번에 최대 3번 검사된다: (1) 작업 브랜치에서 dev PR,
# (2) dev 에서 main PR, (3) main push. pr-merge.sh 는 베이스가 헤드의 조상일 때만
# 머지하므로 세 번 모두 검사 대상 트리가 같다.
# 그래서 같은 워크플로가 이 트리를 이미 끝까지 통과했으면 무거운 잡을 건너뛴다.
# 건너뛰는 게 안전한 이유: 통과 기록(아티팩트)은 모든 잡이 이 트리에서 성공한 뒤에만 만들어진다.
# 건너뛴 잡은 Success 로 보고돼 머지를 막지 않는다(paths 필터는 Pending 으로 남아서 쓰지 않는다).
# 조회가 실패하면 전부 실행한다(fail open). 수동(workflow_dispatch)과 예약 실행은 항상 전부 돈다.
name: db-migrations-ci

on:
  pull_request:

# 같은 PR 에 새 커밋이 오면 이전 리허설을 취소한다(로컬 Docker 스택만 쓰므로 끊어도 안전하다).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # 같은 트리를 이미 통과했는지 확인한다. 통과한 실행이 남긴 아티팩트
  # (tested-tree-db-migrations-<트리 해시>)가 있으면 skip=true 로 무거운 잡을 건너뛴다.
  # 조회가 실패하거나 수동, 예약 실행이면 skip=false 로 전부 돌린다.
  same-tree:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
      tree: ${{ steps.lookup.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Look up tested tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          name="tested-tree-db-migrations-$tree"
          skip=false
          run_id=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "schedule" ]; then
            reason="수동 또는 예약 실행이라 항상 전부 실행"
          elif json=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=10"); then
            count=$(jq '[.artifacts[] | select(.expired == false)] | length' <<<"$json")
            if [ "$count" -ge 1 ] 2>/dev/null; then
              skip=true
              run_id=$(jq -r '[.artifacts[] | select(.expired == false)][0].workflow_run.id' <<<"$json")
              reason="같은 트리를 통과한 실행이 있음"
            else
              reason="같은 트리를 통과한 기록이 없음"
            fi
          else
            reason="아티팩트 조회 실패, 안전하게 전부 실행"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          msg="skip=$skip tree=$tree ($reason)"
          [ -n "$run_id" ] && msg="$msg, 통과한 실행 run_id=$run_id"
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
  rehearse-migrations:
    needs: same-tree
    if: needs.same-tree.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect supabase/ changes
        id: changes
        run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD | grep -q '^supabase/'; then
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=false" >> "$GITHUB_OUTPUT"
            echo "supabase/ 변경 없음 — 리허설 생략"
          fi

      # 새 마이그레이션 파일명의 타임스탬프 검사 — `supabase migration new`가 찍는 실제
      # 생성 시각(UTC)만 허용한다. (1) 미래 시각 금지, (2) 베이스 브랜치에 이미 있는
      # 모든 파일보다 큰 번호여야 한다. 손으로 미래 날짜를 매기면 다른 브랜치의 정상
      # 번호가 뒤로 밀려 push가 막힌다(2026-08-24 사고, db-push-*.yml 주석 참고).
      - name: Check new migration timestamps
        if: steps.changes.outputs.supabase == 'true'
        run: |
          now=$(date -u +%Y%m%d%H%M%S)
          base_max=$(git ls-tree --name-only "origin/$GITHUB_BASE_REF" supabase/migrations/ \
            | sed -E 's#.*/([0-9]{14})_.*#\1#' | grep -E '^[0-9]{14}$' | sort | tail -1)
          fail=0
          for f in $(git diff --name-only --diff-filter=A "origin/$GITHUB_BASE_REF"...HEAD -- supabase/migrations/); do
            name=$(basename "$f")
            ts=$(echo "$name" | sed -E 's/^([0-9]{14})_.*/\1/')
            if ! echo "$ts" | grep -qE '^[0-9]{14}$'; then
              echo "::error file=$f::파일명이 <YYYYMMDDHHMMSS>_<설명>.sql 형식이 아님 — supabase migration new 로 생성할 것"; fail=1; continue
            fi
            if [ "$ts" -gt "$now" ]; then
              echo "::error file=$f::타임스탬프 $ts 가 현재 UTC $now 보다 미래 — 실제 생성 시각만 허용"; fail=1
            fi
            if [ -n "$base_max" ] && [ "$ts" -le "$base_max" ]; then
              echo "::error file=$f::타임스탬프 $ts 가 $GITHUB_BASE_REF 의 마지막 마이그레이션 $base_max 이하 — 베이스 최신화 후 supabase migration new 로 다시 생성할 것"; fail=1
            fi
          done
          exit $fail

      # 마이그레이션에 데이터 문장(insert, update, delete, truncate, merge,
      # copy)이 없는지 검사한다. 마이그레이션은 스키마만 담고, 데이터 변경은
      # supabase/data/ SQL 파일로 CLI에서 실행한다. npm ci 이전 단계라
      # node 내장 모듈만 쓰는 순수 스크립트다.
      - name: Check migration data inserts
        if: steps.changes.outputs.supabase == 'true'
        run: node scripts/check-migration-data-inserts.mjs

      # CLI 버전은 package-lock.json 의 supabase 에서 읽는다(로컬 npx supabase 와 같은 버전).
      - uses: supabase/setup-cli@v3
        if: steps.changes.outputs.supabase == 'true'
      - run: supabase --version
        if: steps.changes.outputs.supabase == 'true'

      - name: Start local database and replay all migrations
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db start

      - name: Reset — migrations + seed full replay
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db reset

      # B2B SQL 스펙을 재생한 로컬 DB 에서 모두 돌린다(같은 잡이라 스택을 다시 띄우지 않는다).
      # 각 스펙은 한 트랜잭션이고 마지막에 ROLLBACK 하며, 단언이 실패하면 psql 이 비정상 종료한다.
      - name: Run B2B SQL specs
        if: steps.changes.outputs.supabase == 'true'
        run: |
          db_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for f in scripts/b2b-*.spec.sql; do
            echo "::group::$f"
            psql "$db_url" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      # 재생한 로컬 DB 의 실제 ACL 로 검사한다. allowlist 밖의 public SECURITY DEFINER 함수나
      # uuid 인자를 받는 함수를 anon 이 실행할 수 있으면 실패한다. 새 함수는 default
      # privileges 로 닫힌 채 시작하므로, 브라우저용 함수는 마이그레이션에 grant 를 써야 한다.
      - name: Check anon function grants
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db query --local -f scripts/check-function-grants.sql

      - name: Lint database schema
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db lint --fail-on error

      # src/types/database.types.ts는 supabase gen types의 생성물(npm run gen:types)이다.
      # 마이그레이션 PR이 이 재생성을 빼먹으면 타입과 DB가 어긋난 채로 머지된다 —
      # 방금 재생한 로컬 DB에서 타입을 다시 뽑아 커밋본과 비교해 잡는다.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changes.outputs.supabase == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.supabase == 'true'
        run: npm ci

      - name: Generate types from rehearsed schema
        if: steps.changes.outputs.supabase == 'true'
        run: supabase gen types typescript --local --schema public > /tmp/database.types.generated.ts

      - name: Check committed database.types.ts matches schema
        if: steps.changes.outputs.supabase == 'true'
        run: node scripts/check-database-types-drift.mjs src/types/database.types.ts /tmp/database.types.generated.ts

  # 위 잡이 전부 성공했을 때만 이 트리의 통과 기록을 남긴다. 건너뛴 실행은 기록하지 않는다.
  record-tree:
    needs: [same-tree, rehearse-migrations]
    if: needs.same-tree.outputs.skip != 'true' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write tested tree
        env:
          TREE: ${{ needs.same-tree.outputs.tree }}
        run: echo "$TREE" > tested-tree.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tested-tree-db-migrations-${{ needs.same-tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 14
          if-no-files-found: error
