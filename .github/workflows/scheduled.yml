# 대학모집요강 데이터 무결성 야간 감사 워크플로.
#
# 배경: `npm run verify` 체인(package.json)에는 스크립트 3개가 있다.
#   1) verify-admission-doc-equivalence.mjs — DB 불필요, 커밋된 골든 fixture만 읽음
#   2) verify-admission-doc-html-drift.mjs  — dev DB 접속 필요(구조화 JSON ↔ 원본 HTML 드리프트 감사)
#   3) verify-admission-bulk-xlsx.mjs        — dev DB 접속 필요(xlsx 왕복 감사)
# 이 3개는 실제 학생에게 노출되는 입시 정보 정확성 게이트인데, 지금까지 CI에
# 연결돼 있지 않아 사람이 수동으로 `npm run verify`를 돌려야만 실행됐다.
# 이 워크플로는 그것을 매일 자동 실행하고, 실패 시 GitHub Issue로 알린다.
# type-check.yml(PR/push 트리거)과는 목적·트리거가 달라 별도 파일로 분리했다.
#
# 필요 secrets (GitHub repo Settings > Secrets and variables > Actions 에서
# 사용자가 직접 등록해야 한다 — 이 파일은 참조만 한다):
#   - SEED_SUPABASE_URL
#   - SEED_SERVICE_ROLE_KEY
# secrets가 등록돼 있지 않으면 위 두 스크립트가 DB 접속에 실패하며
# `npm run verify` 스텝이 non-zero exit로 종료되고, 아래 실패 알림 스텝이
# 자동으로 GitHub Issue를 생성한다.
#
# schedule 트리거는 2026-08-17~08-31 비활성화였다(secrets 미등록 상태로 매일
# 실패 알림만 쌓이는 걸 막기 위함). 2026-08-31 secrets 등록과 함께 부활.
# schedule은 default 브랜치(main)의 워크플로만 실행되므로 main 반영 후 가동된다.

name: Nightly DB Audit

on:
  schedule:
    # KST 04:00 = UTC 19:00(전날). 매일 1회.
    - cron: "0 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN 최소 권한. 실패 알림 스텝이 Issue를 만들려면 issues: write가
    # 필요하다 — 저장소 기본값(read-only)만으로는 "Resource not accessible by
    # integration"으로 알림 자체가 실패한다(2026-09-01 첫 스케줄 실행에서 실제 발생).
    permissions:
      contents: read
      issues: write
    env:
      SEED_SUPABASE_URL: ${{ secrets.SEED_SUPABASE_URL }}
      SEED_SERVICE_ROLE_KEY: ${{ secrets.SEED_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: npm run verify
        run: npm run verify

      # 실패 알림. 같은 원인으로 매일 실패해도 Issue가 하루 하나씩 쌓이지 않도록
      # 라벨 `nightly-db-audit`가 붙은 열린 Issue가 있으면 거기에 코멘트만 남기고,
      # 없을 때만 새 Issue를 만든다.
      - name: 실패 시 GitHub Issue 생성(열린 Issue 있으면 코멘트)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const label = "nightly-db-audit";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `\`npm run verify\` 체인이 실패했습니다. (${today}, run #${context.runId})`,
              "",
              `실행 로그: ${runUrl}`,
              "",
              "SEED_SUPABASE_URL / SEED_SERVICE_ROLE_KEY secrets가 등록돼 있는지 먼저 확인하세요.",
            ].join("\n");

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
              core.info(`기존 Issue #${open[0].number}에 코멘트를 남겼습니다.`);
              return;
            }

            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Nightly DB Audit 실패] ${today}`,
              body,
              labels: [label],
            });
            core.info(`새 Issue #${created.number}를 만들었습니다.`);

  # 위닝에듀(W)·스쿨멘토(S) prod DB 마이그레이션 버전 일치 검사(2026-09-22).
  # 같은 마이그레이션을 두 워크플로가 각각 적용하므로 한쪽만 실패하면 스키마가
  # 어긋난다 — S는 비공개라 사람이 알아채기 어려워 매일 자동으로 대조한다.
  # DB 비밀번호 없이 SUPABASE_ACCESS_TOKEN(Management API SELECT)만 쓴다.
  # SCHOOLMENTOR_PROJECT_REF 변수가 비어 있으면 스크립트가 "건너뜀"으로 정상 종료.
  schema-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SCHOOLMENTOR_PROJECT_REF: ${{ vars.SCHOOLMENTOR_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: W/S 마이그레이션 버전 대조
        run: node scripts/check-schema-parity.mjs

      - name: 실패 시 GitHub Issue 생성(열린 Issue 있으면 코멘트)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const label = "nightly-schema-parity";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `위닝에듀·스쿨멘토 prod DB 마이그레이션 버전이 어긋났습니다. (${today}, run #${context.runId})`,
              "",
              `실행 로그: ${runUrl}`,
              "",
              "db-push-prod / db-push-prod-schoolmentor 실행 이력을 확인하고 실패한 쪽을 workflow_dispatch로 다시 돌리세요.",
            ].join("\n");

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Schema Parity 실패] ${today}`,
              body,
              labels: [label],
            });
