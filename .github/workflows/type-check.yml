name: Type Check

# dev push 에서는 돌지 않는다. dev 에 들어오는 코드는 PR 에서 이미 같은 트리로
# 검사했고(pr-merge.sh 가 조상 검사와 체크 통과를 강제), main 을 dev 에 합친 push 는
# 배포 PR(dev 에서 main)이 검사한다. main push 는 마지막 확인으로 남긴다.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

# 같은 PR 에 새 커밋이 오면 이전 실행을 취소한다. push 실행은 run_id 로 묶여 취소되지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # 정적 검사(tsc 3개, biome). 테스트 잡과 동시에 돈다.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # tsc --noEmit — 타입 에러 자체를 잡는다(strict 서브플래그 위반 포함).
      - name: tsc --noEmit
        run: npm run typecheck

      # api/ 는 별도 tsconfig(NodeNext resolution)로 상대 import .js 확장자
      # 강제 — 2026-08-14 production 크래시(TS import 확장자 사고) 재발 방지 게이트.
      - name: tsc --noEmit (api, NodeNext)
        run: npm run typecheck:api

      # scripts/ 는 기본 tsconfig에서 exclude돼 있어 src/lib 리팩토링을 따라가지
      # 못한 죽은 스크립트가 2026-09-01 야간 DB 감사에서야 드러났다. 별도 tsconfig로
      # .mjs 스크립트도 타입체크 대상에 넣는다(1차: strictNullChecks 계열 off).
      - name: tsc --noEmit (scripts)
        run: npm run typecheck:scripts

      - name: biome ci
        run: npm run format:ci

  # type-coverage 는 타입 검사를 처음부터 다시 해서 38초에서 70초가 걸린다.
  # static 잡에 두면 그 잡이 가장 늦게 끝나므로 따로 떼어 동시에 돌린다.
  type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # any 비율 후퇴 방지 게이트. 임계값은 package.json의 type-coverage
      # 스크립트(--at-least)에 고정돼 있다 — 개선되면 npx type-coverage --update로
      # 임계값을 올릴 수 있지만 낮추려면 리뷰에서 이유를 설명해야 한다.
      - name: type-coverage
        run: npm run type-coverage

  # 회귀 테스트 전체(goal/calc·진단 채점 등 순수 로직 + admission/performance
  # DOM 렌더링·에디터·모달 등 컴포넌트 테스트) — 골든 픽스처·파리티가
  # 깨지면 여기서 즉시 잡는다.
  # 테스트 파일을 4묶음으로 나눠 4개 잡이 동시에 돈다(Vitest --shard, 파일 단위 분할).
  # 묶음마다 따로 통과와 실패를 판정하므로 한 묶음이라도 실패하면 PR 체크가 실패한다.
  # fail-fast 를 꺼서 한 번 실행에 모든 묶음의 실패를 다 본다.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: vitest run (${{ matrix.shard }}/4)
        run: npm test -- --shard=${{ matrix.shard }}/4
